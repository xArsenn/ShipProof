name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/cli.js verify --config examples/shipproof.json --base HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipproof-evidence
          path: shipproof-report.*
